name: Build Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: '是否启用代码签名(需配置 Secrets)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon runner
            target: mac
            arch: arm64
            artifact: dist/*.dmg
          - os: windows-latest   # x64 runner
            target: win
            arch: x64
            artifact: dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache python-build-standalone
        uses: actions/cache@v4
        with:
          path: .cache/pbs
          key: pbs-${{ matrix.os }}-${{ hashFiles('scripts/python-runtime.json') }}

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ebuilder-v2-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ebuilder-v2-${{ matrix.os }}-

      - name: Install npm deps
        run: npm ci --no-audit --no-fund
        # postinstall 会自动跑 electron-builder install-app-deps,
        # 重编 better-sqlite3 到对应平台的 Electron ABI。

      - name: Fetch Python runtime (PBS)
        run: npm run fetch:python

      - name: Install Python deps to embedded runtime (with strip)
        run: npm run install:py-deps:strip

      # ─── 签名密钥(可选)─────────────────────────────────────────────────────
      - name: Setup macOS signing
        if: matrix.target == 'mac'
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MAC_CERT_BASE64" ]; then
            echo "MAC_CERT_BASE64 未配置,跳过签名"
            exit 0
          fi
          echo "$MAC_CERT_BASE64" | base64 --decode > /tmp/mac-cert.p12
          echo "HAS_MAC_CERT=true" >> $GITHUB_ENV

      - name: Build installer (macOS)
        if: matrix.target == 'mac'
        env:
          HAS_MAC_CERT: ${{ env.HAS_MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # CSC_LINK 只在证书文件存在时才导出;空字符串会误触发 electron-builder 签名
          if [ "$HAS_MAC_CERT" = "true" ]; then
            export CSC_LINK=/tmp/mac-cert.p12
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --arm64 --publish never

      - name: Build installer (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          # WIN_CSC_LINK 不设置,跳过 Windows 代码签名
          npx electron-builder --win --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer-mac-arm64/*.dmg
            artifacts/installer-win-x64/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
